<div class="master-category-container">
  <div class="master-header">
    <div class="header-content">
      <h1 class="page-title">📊 Master Category Management</h1>
      <p class="page-subtitle">Manage and organize master categories</p>
    </div>
  </div>

  <div class="master-content">
    <!-- ================= TABLE ================= -->
    <app-generic-table 
      title="Master Categories" 
      [columns]="columns" 
      [data]="data" 
      (added)="onAdd()" 
      (edit)="onEdit($event)"
      (delete)="onDelete($event)">
    </app-generic-table>

    <!-- ================= FORM ================= -->
    <div [formGroup]="form">
      <app-generic-form-model 
        [form]="form" 
        title="Add/Edit Category" 
        [show]="showModal" 
        (save)="save(form.value)"
        (close)="showModal=false">

        <div class="form-section">
          <label class="form-label">Category Name *</label>
          <input 
            class="form-input" 
            formControlName="name" 
            placeholder="Enter category name"
            [class.is-invalid]="form.get('name')?.invalid && form.get('name')?.touched">
          
          <div class="invalid-feedback" *ngIf="form.get('name')?.invalid && form.get('name')?.touched">
            Category name is required
          </div>
        </div>

        <div class="form-section">
          <label class="form-label">Description</label>
          <textarea 
            class="form-textarea" 
            formControlName="description"
            placeholder="Enter category description (optional)"
            rows="3"></textarea>
        </div>

        <div class="form-section">
          <label class="form-label">Status</label>
          <select class="form-select" formControlName="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

      </app-generic-form-model>
    </div>
  </div>
</div>
