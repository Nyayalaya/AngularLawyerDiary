<!-- Loading -->
<ng-container *ngIf="(loading$ | async); else tableOrError">
  <div class="loader-container">
    <div class="loader-card">
      <div class="spinner"></div>
      <p class="loading-text">Loading form subtypes...</p>
    </div>
  </div>
</ng-container>

<!-- Table -->
<ng-template #tableOrError>

  <!-- Error Banner -->
  <div *ngIf="(error$ | async) as error"
       class="alert alert-danger d-flex align-items-center gap-2 mb-3">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span>{{ error }}</span>
  </div>

  <app-generic-table
    *ngIf="!showForm()"
    title="Form SubTypes"
    [data]="(formSubTypes$ | async) || []"
    [columns]="columns"
    [serverSide]="true"
    [totalRecords]="(totalRecords$ | async) || 0"
    [currentPage]="(pageNumber$   | async) || 1"
    [pageSize]="(pageSize$     | async) || 10"
    [totalPages]="(totalPages$   | async) || 0"
    (added)="toggleForm()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
    (view)="onView($event)"
    (pageChanged)="onPageChanged($event)">
  </app-generic-table>

</ng-template>

<!-- Form -->
<div [formGroup]="formSubTypeForm">
  <app-generic-form-model
    [form]="formSubTypeForm"
    [title]="isEditMode() ? 'Edit Form SubType' : 'Add Form SubType'"
    [show]="showForm()"
    (save)="onSubmit()"
    (close)="showForm.set(false)">

    <select
      class="form-control"
      formControlName="formId"
      [class.is-invalid]="formSubTypeForm.get('formId')?.invalid &&
                           formSubTypeForm.get('formId')?.touched">
      <option value="">Select Form Master</option>
      <option *ngFor="let formMaster of (formMasters$ | async)" [value]="formMaster.id">
        {{ formMaster.name }}
      </option>
    </select>
    <div class="invalid-feedback">
      Form Master is required
    </div>

    <input
      class="form-control mt-2"
      formControlName="name"
      placeholder="Form SubType Name"
      [class.is-invalid]="formSubTypeForm.get('name')?.invalid &&
                           formSubTypeForm.get('name')?.touched">
    <div class="invalid-feedback">
      Form SubType Name is required (min 2 characters)
    </div>

    <input
      class="form-control mt-2"
      formControlName="code"
      placeholder="Code"
      [class.is-invalid]="formSubTypeForm.get('code')?.invalid &&
                           formSubTypeForm.get('code')?.touched">
    <div class="invalid-feedback">
      Code is required (min 2 characters)
    </div>

    <textarea
      class="form-control mt-2"
      formControlName="description"
      placeholder="Description (Optional)"
      rows="3"></textarea>

  </app-generic-form-model>
</div>
