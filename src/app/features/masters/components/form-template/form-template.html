<!-- LIST VIEW -->
<div *ngIf="viewMode() === 'list'">
  <!-- Loading -->
  <ng-container *ngIf="(loading$ | async); else tableOrError">
    <div class="loader-container">
      <div class="loader-card">
        <div class="spinner"></div>
        <p class="loading-text">Loading form templates...</p>
      </div>
    </div>
  </ng-container>

  <!-- Table -->
  <ng-template #tableOrError>
    <!-- Error Banner -->
    <div *ngIf="(error$ | async) as error"
         class="alert alert-danger d-flex align-items-center gap-2 mb-3">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span>{{ error }}</span>
    </div>

    <!-- <div class="list-header">
      <h2 class="list-title">
        <i class="bi bi-file-text"></i> Form Templates
      </h2>
      <button class="btn btn-primary btn-add" (click)="showFormView()">
        <i class="bi bi-plus-lg"></i> Add New 
      </button>
    </div> -->

    <app-generic-table
      title="Templates"
      [data]="(formTemplates$ | async) || []"
      [columns]="columns"
      [serverSide]="true"
      [totalRecords]="(totalRecords$ | async) || 0"
      [currentPage]="(pageNumber$   | async) || 1"
      [pageSize]="(pageSize$     | async) || 10"
      [totalPages]="(totalPages$   | async) || 0"
      (added)="showFormView()"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
      (view)="onView($event)"
      (pageChanged)="onPageChanged($event)">
    </app-generic-table>
  </ng-template>
</div>

<!-- FORM VIEW -->
<div *ngIf="viewMode() === 'form'" class="form-view-container">
  <div class="form-header">
    <div class="form-header-content">
      <button class="btn btn-outline-secondary btn-back" (click)="showListView()">
        <i class="bi bi-arrow-left"></i> Back to List
      </button>
      <h1 class="form-title">
        <i class="bi bi-pencil-square"></i>
        {{ isEditMode() ? 'Edit Form Template' : 'Create New Form Template' }}
      </h1>
    </div>
  </div>

  <form [formGroup]="formTemplateForm" class="form-container">
    <!-- Form SubType Select2 -->
    <div class="form-section">
      <label class="form-label">
        <i class="bi bi-collection"></i> Form SubType <span class="required">*</span>
      </label>
      <select 
        #formSubTypeSelect
        class="form-control select2-element"
        formControlName="formSubtypeId"
        [class.is-invalid]="formTemplateForm.get('formSubtypeId')?.invalid && formTemplateForm.get('formSubtypeId')?.touched">
        <option value="">Select Form SubType</option>
        <option *ngFor="let subtype of (formSubTypes$ | async)" [value]="subtype.id">
          {{ subtype.name }}
        </option>
      </select>
      <div class="invalid-feedback" *ngIf="formTemplateForm.get('formSubtypeId')?.invalid && formTemplateForm.get('formSubtypeId')?.touched">
        Form SubType is required
      </div>
    </div>

    <!-- Title -->
    <div class="form-section">
      <label class="form-label">
        <i class="bi bi-type"></i> Template Title <span class="required">*</span>
      </label>
      <input
        type="text"
        class="form-control"
        formControlName="title"
        placeholder="Enter template title"
        [class.is-invalid]="formTemplateForm.get('title')?.invalid && formTemplateForm.get('title')?.touched">
      <div class="invalid-feedback" *ngIf="formTemplateForm.get('title')?.invalid && formTemplateForm.get('title')?.touched">
        Title is required (minimum 3 characters)
      </div>
    </div>

    <!-- Editor Section -->
    <div class="editor-section">
      <label class="form-label">
        <i class="bi bi-pencil"></i> Template Content <span class="required">*</span>
      </label>
      
      <!-- Toolbar -->
      <div class="editor-toolbar">
        <div class="toolbar-group">
          <button type="button" class="toolbar-btn" title="Bold" (click)="applyBold()">
            <i class="bi bi-type-bold"></i>
          </button>
          <button type="button" class="toolbar-btn" title="Italic" (click)="applyItalic()">
            <i class="bi bi-type-italic"></i>
          </button>
          <button type="button" class="toolbar-btn" title="Underline" (click)="applyUnderline()">
            <i class="bi bi-type-underline"></i>
          </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
          <button type="button" class="toolbar-btn" title="Unordered List" (click)="insertList()">
            <i class="bi bi-list-ul"></i>
          </button>
          <button type="button" class="toolbar-btn" title="Ordered List" (click)="insertOrderedList()">
            <i class="bi bi-list-ol"></i>
          </button>
          <button type="button" class="toolbar-btn" title="Insert Link" (click)="insertLink()">
            <i class="bi bi-link-45deg"></i>
          </button>
          <button type="button" class="toolbar-btn" title="Insert Image" (click)="insertImage()">
            <i class="bi bi-image"></i>
          </button>
          <button type="button" class="toolbar-btn" title="Insert Table" (click)="insertTable()">
            <i class="bi bi-table"></i>
          </button>
        </div>

        <div class="toolbar-divider"></div>

        <div class="toolbar-group">
          <button type="button" class="toolbar-btn toolbar-btn-danger" title="Clear Formatting" (click)="clearFormatting()">
            <i class="bi bi-eraser"></i>
          </button>
        </div>
      </div>

      <!-- Editor -->
      <editor
  formControlName="templateContent"
  [init]="editorConfig">
</editor>
      <div class="invalid-feedback" *ngIf="formTemplateForm.get('templateContent')?.invalid && formTemplateForm.get('templateContent')?.touched">
        Template content is required
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="form-actions">
      <button 
        type="button" 
        class="btn btn-secondary btn-lg"
        (click)="showListView()">
        <i class="bi bi-x-circle"></i> Cancel
      </button>
      <button 
        type="button" 
        class="btn btn-primary btn-lg"
        (click)="onSubmit()"
        [disabled]="formTemplateForm.invalid">
        <i class="bi bi-check-circle"></i> {{ isEditMode() ? 'Update' : 'Create' }} Template
      </button>
    </div>
  </form>
</div>
