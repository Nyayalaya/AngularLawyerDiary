<!-- Loading -->
<ng-container *ngIf="(loading$ | async); else tableOrError">
  <div class="loader-container">
    <div class="loader-card">
      <div class="spinner"></div>
      <p class="loading-text">Loading works...</p>
    </div>
  </div>
</ng-container>

<!-- Table -->
<ng-template #tableOrError>

  <!-- Error Banner -->
  <div *ngIf="(error$ | async) as error"
       class="alert alert-danger d-flex align-items-center gap-2 mb-3">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span>{{ error }}</span>
  </div>

  <app-generic-table
    *ngIf="!showForm()"
    title="Works"
    [data]="(works$ | async) || []"
    [columns]="columns"
    [serverSide]="true"
    [totalRecords]="(totalRecords$ | async) || 0"
    [currentPage]="(pageNumber$ | async) || 1"
    [pageSize]="(pageSize$ | async) || 10"
    [totalPages]="(totalPages$ | async) || 0"
    (added)="toggleForm()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
    (view)="onView($event)"
    (pageChanged)="onPageChanged($event)">
  </app-generic-table>

</ng-template>

<!-- Form -->
<div [formGroup]="workForm" *ngIf="showForm()">
  <div class="form-container">
    <div class="form-header">
      <h3>{{ isEditMode() ? 'Edit Work' : 'Add Work' }}</h3>
      <button type="button" class="btn-close" (click)="showForm.set(false)"></button>
    </div>

    <div class="form-body">
      <div class="mb-3">
        <label class="form-label">Work Type <span class="text-danger">*</span></label>
        <ng-select
          formControlName="workTypeId"
          [items]="(workTypes$ | async) || []"
          bindLabel="name"
          bindValue="id"
          placeholder="Select Work Type"
          [searchable]="true"
          [clearable]="true"
          [compareWith]="compareWorkTypes"
          [class.ng-invalid]="workForm.get('workTypeId')?.invalid &&
                               workForm.get('workTypeId')?.touched">
        </ng-select>
        <div class="invalid-feedback d-block" 
             *ngIf="workForm.get('workTypeId')?.invalid &&
                    workForm.get('workTypeId')?.touched">
          Work Type is required
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Work <span class="text-danger">*</span></label>
        <input
          class="form-control"
          formControlName="work"
          placeholder="Enter Work"
          [class.is-invalid]="workForm.get('work')?.invalid &&
                               workForm.get('work')?.touched">
        <div class="invalid-feedback">
          Work is required (min 2 characters)
        </div>
      </div>
    </div>

    <div class="form-footer">
      <button type="button" class="btn btn-secondary" (click)="showForm.set(false)">Cancel</button>
      <button type="button" class="btn btn-primary" (click)="onSubmit()">Save</button>
    </div>
  </div>
</div>

<!-- Modal Overlay -->
<div class="modal-overlay" *ngIf="showForm()" (click)="showForm.set(false)"></div>
