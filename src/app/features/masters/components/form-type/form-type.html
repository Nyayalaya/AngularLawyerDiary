<!-- Loading -->
<ng-container *ngIf="(loading$ | async); else tableOrError">
  <div class="loader-container">
    <div class="loader-card">
      <div class="spinner"></div>
      <p class="loading-text">Loading form types...</p>
    </div>
  </div>
</ng-container>

<!-- Table -->
<ng-template #tableOrError>

  <!-- Error Banner -->
  <div *ngIf="(error$ | async) as error"
       class="alert alert-danger d-flex align-items-center gap-2 mb-3">
    <i class="bi bi-exclamation-triangle-fill"></i>
    <span>{{ error }}</span>
  </div>

  <app-generic-table
    *ngIf="!showForm()"
    title="Form Types"
    [data]="(formTypes$ | async) || []"
    [columns]="columns"
    [serverSide]="true"
    [totalRecords]="(totalRecords$ | async) || 0"
    [currentPage]="(pageNumber$   | async) || 1"
    [pageSize]="(pageSize$     | async) || 10"
    [totalPages]="(totalPages$   | async) || 0"
    (added)="toggleForm()"
    (edit)="onEdit($event)"
    (delete)="onDelete($event)"
    (view)="onView($event)"
    (pageChanged)="onPageChanged($event)">
  </app-generic-table>

</ng-template>

<!-- Form -->
<div [formGroup]="formTypeForm">
  <app-generic-form-model
    [form]="formTypeForm"
    [title]="isEditMode() ? 'Edit Form Type' : 'Add Form Type'"
    [show]="showForm()"
    (save)="onSubmit()"
    (close)="showForm.set(false)">

    <input
      class="form-control"
      formControlName="name"
      placeholder="Form Type Name"
      [class.is-invalid]="formTypeForm.get('name')?.invalid &&
                           formTypeForm.get('name')?.touched">
    <div class="invalid-feedback">
      Form Type Name is required (min 2 characters)
    </div>

    <input
      class="form-control mt-2"
      formControlName="code"
      placeholder="Code"
      [class.is-invalid]="formTypeForm.get('code')?.invalid &&
                           formTypeForm.get('code')?.touched">
    <div class="invalid-feedback">
      Code is required (min 2 characters)
    </div>

    <textarea
      class="form-control mt-2"
      formControlName="description"
      placeholder="Description (Optional)"
      rows="3"></textarea>

    <input
      type="number"
      class="form-control mt-2"
      formControlName="displayOrder"
      placeholder="Display Order"
      [class.is-invalid]="formTypeForm.get('displayOrder')?.invalid &&
                           formTypeForm.get('displayOrder')?.touched">
    <div class="invalid-feedback">
      Display Order is required
    </div>

    <div class="form-check mt-3">
      <input
        type="checkbox"
        class="form-check-input"
        id="isactive"
        formControlName="isactive">
      <label class="form-check-label" for="isactive">
        Active
      </label>
    </div>

  </app-generic-form-model>
</div>
