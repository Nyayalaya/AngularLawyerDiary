<div class="conversation-sidebar-container">
  <div class="sidebar-header">
    <h3>Conversations</h3>
    <button class="new-conv-btn" type="button" (click)="createNewConversation()" title="New conversation">
      <span class="material-icons">add</span>
    </button>
  </div>

  <div class="search-bar">
    <span class="material-icons search-icon">search</span>
    <input
      #searchBox
      type="text"
      placeholder="Search conversations..."
      (input)="onSearch(searchBox.value)"
      class="search-input"
    />
  </div>

  <div class="conversations-list">
    <ng-container *ngIf="(conversations$ | async)?.length === 0; else conversationsList">
      <div class="no-conversations">
        <p>No conversations yet</p>
        <p class="hint">Start a new conversation to begin.</p>
      </div>
    </ng-container>

    <ng-template #conversationsList>
      <button
        class="conversation-item"
        *ngFor="let conversation of conversations$ | async"
        [class.active]="(selectedConversationId$ | async) === conversation.id"
        (click)="selectConversation(conversation.id)"
        type="button"
      >
        <span class="conversation-info">
          <span class="conversation-title">{{ conversation.title }}</span>
          <span class="conversation-meta">
            <span class="message-count">{{ conversation.messageCount }} messages</span>
            <span class="last-message" *ngIf="conversation.lastMessage">
              {{ conversation.lastMessage | slice: 0:44 }}
            </span>
          </span>
        </span>

        <span class="conversation-actions">
          <button
            class="action-btn pin-btn"
            [class.pinned]="conversation.pinned"
            (click)="pinConversation(conversation.id, conversation.pinned || false, $event)"
            title="Pin"
            type="button"
          >
            <span class="material-icons">push_pin</span>
          </button>
          <button
            class="action-btn delete-btn"
            (click)="deleteConversation(conversation.id, $event)"
            title="Delete"
            type="button"
          >
            <span class="material-icons">delete</span>
          </button>
        </span>
      </button>
    </ng-template>
  </div>
</div>
