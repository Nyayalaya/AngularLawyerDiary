<div class="chat-input-container">
  <div class="attached-files" *ngIf="attachedFiles.length > 0">
    <div class="file-item" *ngFor="let file of attachedFiles; let i = index">
      <span class="material-icons file-icon">description</span>
      <span class="file-name">{{ file.name }}</span>
      <button type="button" class="remove-btn" (click)="removeAttachment(i)" title="Remove file">
        <span class="material-icons">close</span>
      </button>
    </div>
  </div>

  <div class="input-wrapper">
    <textarea
      class="message-input"
      [(ngModel)]="messageContent"
      placeholder="Ask anything about your cases, documents, or legal matters..."
      (keypress)="handleKeyPress($event)"
      [disabled]="isDisabled"
      rows="2"
    ></textarea>

    <div class="input-actions">
      <button
        type="button"
        class="action-btn"
        title="Attach file"
        (click)="triggerFileInput()"
        [disabled]="isDisabled"
      >
        <span class="material-icons">attach_file</span>
      </button>
      <input
        type="file"
        #fileInput
        hidden
        multiple
        (change)="onFileSelected($event)"
        accept=".pdf,.doc,.docx,.txt,.jpg,.png"
      />
      <button
        type="button"
        class="send-btn"
        (click)="sendMessage()"
        [disabled]="!messageContent.trim() || isDisabled || isSending"
      >
        <span *ngIf="!isSending">Send</span>
        <span class="material-icons" *ngIf="!isSending">send</span>
        <span *ngIf="isSending">Sending...</span>
      </button>
    </div>
  </div>
</div>
