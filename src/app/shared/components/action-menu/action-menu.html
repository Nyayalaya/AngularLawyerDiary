<div class="btn-group btn-group-sm">

  @if (showView) {
  <button class="btn btn-outline-info" (click)="view.emit()">
    {{ viewLabel }}
  </button>
  }

  @if (showEdit) {
  <button class="btn btn-outline-primary" (click)="edit.emit()">
    {{ editLabel }}
  </button>
  }

  @if (showDelete) {
  <button class="btn btn-outline-danger" (click)="delete.emit()">
    {{ deleteLabel }}
  </button>
  }

</div>
